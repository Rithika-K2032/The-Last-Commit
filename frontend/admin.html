<!DOCTYPE html>
<html>
<head>
    <title>The Last Commit - Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: #b7ff00;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: #111;
            border: 1px solid #b7ff00;
            padding: 25px;
            min-width: 180px;
        }

        .number {
            font-size: 35px;
            font-weight: bold;
            margin-top: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        input,
        select {
            background: #111;
            color: white;
            border: 1px solid #555;
            padding: 13px;
            font-size: 15px;
        }

        input {
            width: 300px;
        }

        select {
            width: 200px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #0d0d0d;
        }

        th,
        td {
            padding: 14px;
            border: 1px solid #333;
            text-align: left;
        }

        th {
            color: #b7ff00;
            background: #151515;
        }

        td {
            color: #ddd;
        }

        .delete-btn {
            background: #ff3333;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn:hover {
            opacity: 0.8;
        }

        .error {
            color: #ff5555;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #888;
        }
    </style>
</head>

<body>

    <h1>&lt;ADMIN /&gt;</h1>

    <div class="subtitle">
        THE LAST COMMIT - Registration Dashboard
    </div>

    <!-- STATISTICS -->

    <div class="stats">

        <div class="card">
            <div>Total Registrations</div>
            <div class="number" id="total">0</div>
        </div>

        <div class="card">
            <div>Web / App</div>
            <div class="number" id="web">0</div>
        </div>

        <div class="card">
            <div>AI / ML</div>
            <div class="number" id="ai">0</div>
        </div>

        <div class="card">
            <div>Cybersecurity</div>
            <div class="number" id="cyber">0</div>
        </div>

    </div>

    <!-- SEARCH + FILTER -->

    <div class="controls">

        <input
            type="text"
            id="search"
            placeholder="Search name, email or college..."
        >

        <select id="filter">
            <option value="All">All Tracks</option>
            <option value="Web/App">Web / App</option>
            <option value="AI/ML">AI / ML</option>
            <option value="Cybersecurity">Cybersecurity</option>
        </select>

    </div>

    <!-- TABLE -->

    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>College</th>
                <th>Year</th>
                <th>Team</th>
                <th>Track</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="data">
            <tr>
                <td colspan="8" class="empty">
                    Loading...
                </td>
            </tr>
        </tbody>

    </table>

    <script>

        let registrations = [];

        // LOAD DATA

        async function loadData() {

            try {

                const response = await fetch(
                    "http://localhost:5000/api/admin/registrations"
                );

                registrations = await response.json();

                updateStats();

                displayRegistrations();

            } catch (error) {

                document.getElementById("data").innerHTML =
                    `<tr>
                        <td colspan="8" class="error">
                            Could not load registrations.
                        </td>
                    </tr>`;

            }
        }

        // UPDATE STATISTICS

        function updateStats() {

            document.getElementById("total").textContent =
                registrations.length;

            document.getElementById("web").textContent =
                registrations.filter(
                    x => x.track === "Web/App"
                ).length;

            document.getElementById("ai").textContent =
                registrations.filter(
                    x => x.track === "AI/ML"
                ).length;

            document.getElementById("cyber").textContent =
                registrations.filter(
                    x => x.track === "Cybersecurity"
                ).length;
        }

        // DISPLAY REGISTRATIONS

        function displayRegistrations() {

            const searchValue =
                document.getElementById("search")
                .value
                .toLowerCase();

            const filterValue =
                document.getElementById("filter")
                .value;

            const filtered = registrations.filter(user => {

                const matchesSearch =
                    (user.name || "").toLowerCase().includes(searchValue) ||
                    (user.email || "").toLowerCase().includes(searchValue) ||
                    (user.college || "").toLowerCase().includes(searchValue);

                const matchesTrack =
                    filterValue === "All" ||
                    user.track === filterValue;

                return matchesSearch && matchesTrack;
            });

            const table =
                document.getElementById("data");

            table.innerHTML = "";

            if (filtered.length === 0) {

                table.innerHTML =
                    `<tr>
                        <td colspan="8" class="empty">
                            No registrations found.
                        </td>
                    </tr>`;

                return;
            }

            filtered.forEach(user => {

                const row =
                    document.createElement("tr");

                row.innerHTML = `
                    <td>${user.name || ""}</td>
                    <td>${user.email || ""}</td>
                    <td>${user.phone || ""}</td>
                    <td>${user.college || ""}</td>
                    <td>${user.year || ""}</td>
                    <td>${user.teamName || ""}</td>
                    <td>${user.track || ""}</td>

                    <td>
                        <button
                            class="delete-btn"
                            onclick="deleteRegistration(${user.id})"
                        >
                            DELETE
                        </button>
                    </td>
                `;

                table.appendChild(row);
            });
        }

        // DELETE REGISTRATION

        async function deleteRegistration(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this registration?"
                );

            if (!confirmDelete) {
                return;
            }

            try {

                const response = await fetch(
                    `http://localhost:5000/api/admin/registrations/${id}`,
                    {
                        method: "DELETE"
                    }
                );

                const result =
                    await response.json();

                if (!response.ok) {

                    alert(
                        result.message ||
                        "Delete failed."
                    );

                    return;
                }

                await loadData();

            } catch (error) {

                alert(
                    "Could not connect to backend."
                );

            }
        }

        // SEARCH

        document
            .getElementById("search")
            .addEventListener(
                "input",
                displayRegistrations
            );

        // FILTER

        document
            .getElementById("filter")
            .addEventListener(
                "change",
                displayRegistrations
            );

        // INITIAL LOAD

        loadData();

    </script>

</body>
</html>
